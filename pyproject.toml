[project]
name = "iis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.3,<5.0.0",
    "dagshub>=0.7.0",
    "dvc-s3>=3.3.0",
    "evidently>=0.7.21",
    "great-expectations==0.18.21",
    "html5lib>=1.1",
    "jupyter>=1.1.1",
    "mlflow>=3.13.0",
    "pyaml>=25.1.0,<26.0.0",
    "requests>=2.32.3,<3.0.0",
    "tensorflow>=2.18.1",
    "torch==2.2.2",
    "torchvision==0.17.2",
    "torchaudio==2.2.2",
    "xgboost>=3.2.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
