schema: '2.0'
stages:
  fetch:
    cmd: "uv run python src/traffic_scraper.py\ngit commit -am \"Updated raw traffic
      data on `date` with DVC pipeline and GitHub workflows\" || true\ngit push ||
      true\ndvc push || true\n"
    deps:
    - path: src/traffic_scraper.py
      hash: md5
      md5: 41e5791857f35c1014e28c7899ea1f25
      size: 2586
    params:
      params.yaml:
        fetch.output: data/traffic.csv
        fetch.url: http://portal.drsc.si/traffic/loclist_si.htm
    outs:
    - path: data/traffic.csv
      hash: md5
      md5: 6c368727416c2e71318fe24f03fdf302
      size: 427746
  preprocess:
    cmd: "uv run python src/traffic_preprocess.py\ngit commit -am \"Updated preprocessed
      traffic data on `date` with DVC pipeline and GitHub workflows\" || true\ngit
      push || true\ndvc push || true\n"
    deps:
    - path: data/traffic.csv
      hash: md5
      md5: 6c368727416c2e71318fe24f03fdf302
      size: 427746
    - path: src/traffic_preprocess.py
      hash: md5
      md5: ff7c294f07e1f75ccf344601f47d106d
      size: 1647
    params:
      params.yaml:
        preprocess.input: data/traffic.csv
        preprocess.output: data/preprocessed/traffic.csv
    outs:
    - path: data/preprocessed/traffic.csv
      hash: md5
      md5: 6d942be2f85450b9e638bd220a122819
      size: 423006
