fetch:
  url: "http://portal.drsc.si/traffic/loclist_si.htm"
  output: "data/traffic.csv"

preprocess:
  input: "data/traffic.csv"
  output: "data/preprocessed/traffic.csv"
  random_state: 42
  target_col: "Stanje"
  timestamp_col: "Čas"
  location_col: "Lokacija"
  direction_col: "Smer"
  road_col: "Cesta"
  fill_missing_timestamps: true
  create_time_diff: true
  time_diff_unit: "minutes"
  location_key_cols:
    - "Lokacija"
    - "Smer"
  remove_location_leakage: true
  create_time_features: true
  no_data_label: "Ni podatka"
  no_data_output: "data/preprocessed/traffic_nodata.csv"
  filter_no_data: true

train:
  random_state: 42
  test_size: 0.2
  use_time_split: true
  model_type: "mlp"
  mlflow_tracking_uri: "https://dagshub.com/TjanKazar/IIS_proj.mlflow"
  mlflow_experiment: "traffic_mlp_train"
  mlp:
    hidden_dims: [256, 128, 64]
    dropout_rate: 0.3
    batch_norm: true
    learning_rate: 0.001
    weight_decay: 0.0001
    batch_size: 512
    max_epochs: 100
    patience: 10