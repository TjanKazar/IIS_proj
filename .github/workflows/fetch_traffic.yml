name: Traffic DVC Pipeline

on:
  workflow_dispatch:
  schedule:
    #runs every day at midnight
    - cron: '0 16 * * *'
permissions:
  contents: read
  packages: write
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Setup Git
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      - name: Sync with remote
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Configure DVC remote
        env:
          DAGSHUB_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          DAGSHUB_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          uv run dvc remote modify origin --local access_key_id "$DAGSHUB_ACCESS_KEY_ID"
          uv run dvc remote modify origin --local secret_access_key "$DAGSHUB_SECRET_ACCESS_KEY"

      - name: Run full DVC pipeline
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/TjanKazar/IIS_proj.mlflow
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          uv run dvc pull || true
          uv run dvc repro
          uv run dvc push

      - name: Upload trained models (for Docker build)
        uses: actions/upload-artifact@v4
        with:
          name: trained-models
          path: models/

      - name: Commit artifacts
        id: commit
        run: |
          git add dvc.lock
          git add src/reports/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update pipeline artifacts on $(date -u)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push changes
        if: steps.commit.outputs.changed == 'true'
        run: |
          git push origin HEAD:main

  build-and-push:
    runs-on: ubuntu-latest
    needs: pipeline
    if: success()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download trained models
        uses: actions/download-artifact@v4
        with:
          name: trained-models
          path: models/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ghcr.io/tjankazar/iis-api:latest
            ghcr.io/tjankazar/iis-api:${{ github.sha }}

      - name: Trigger Render deploy
        run: |
          curl -X POST "https://api.render.com/deploy/srv-${{ secrets.RENDER_SERVICE_ID }}?key=${{ secrets.RENDER_API_KEY }}"