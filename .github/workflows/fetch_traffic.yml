name: Traffic DVC Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Setup Git
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      - name: Sync with remote
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Configure DVC remote
        env:
          DAGSHUB_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          DAGSHUB_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          uv run dvc remote modify origin --local access_key_id "$DAGSHUB_ACCESS_KEY_ID"
          uv run dvc remote modify origin --local secret_access_key "$DAGSHUB_SECRET_ACCESS_KEY"

      - name: Run full DVC pipeline
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/TjanKazar/IIS_proj.mlflow
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          uv run dvc pull || true
          uv run dvc repro
          uv run dvc push

      - name: Commit artifacts
        id: commit
        run: |
          git add dvc.lock
          git add src/reports/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update pipeline artifacts on $(date -u)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push changes
        if: steps.commit.outputs.changed == 'true'
        run: |
          git push origin HEAD:main

