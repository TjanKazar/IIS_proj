name: Fetch data on schedule

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  fetch_air:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Install DVC
        run: |
          uv pip install --system "dvc[s3]"

      - name: Setup Git
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      # Synchronize BEFORE running DVC
      - name: Sync with remote
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Install runtime deps
        run: |
          uv sync --frozen

      - name: DVC setup remote
        env:
          DAGSHUB_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          DAGSHUB_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          dvc remote modify origin --local access_key_id "$DAGSHUB_ACCESS_KEY_ID"
          dvc remote modify origin --local secret_access_key "$DAGSHUB_SECRET_ACCESS_KEY"

      - name: Run DVC pipeline
        run: |
          dvc pull || true
          dvc repro
          dvc push

      - name: Commit lockfile changes
        id: commit
        run: |
          git add dvc.lock

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update dvc.lock on $(date -u)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push changes
        if: steps.commit.outputs.changed == 'true'
        run: |
          git push origin HEAD:main

      - name: Deploy DataDocs to Netlify
        uses: nwtgck/actions-netlify@v1.2
        with:
          publish-dir: gx/uncommitted/data_docs/local_site
          production-deploy: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}