name: Fetch traffic data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  fetch_traffic:
    name: Fetch and append traffic data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run DVC pipeline
        run: uv run dvc repro

      - name: Push data to DVC remote
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: uv run dvc push

      - name: Commit DVC metadata
        run: |
          git add dvc.lock
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git diff --staged --quiet || git commit -m "Update traffic data $(date -u '+%Y-%m-%d %H:%M UTC')"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.PAT_TOKEN }}